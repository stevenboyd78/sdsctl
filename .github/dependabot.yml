version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      monthly-github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/home-assistant/sds200"
    schedule:
      interval: monthly
    labels:
      - dependencies
