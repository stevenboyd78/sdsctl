name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"

          PACKAGE_VERSION="$(python -c 'import sds200; print(sds200.__version__)')"

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi

          if [[ "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "sds200.__version__ ${PACKAGE_VERSION} does not match ${VERSION}"
            exit 1
          fi

      - name: Run release checks
        run: |
          ruff check .
          mypy src/sds200
          pytest --cov=sds200 --cov-report=term-missing
          python scripts/check_docs.py
          python scripts/generate_web_dashboard_screenshots.py --verify-gallery
          node scripts/audit_web_dashboard_browser.mjs --startup-timeout-ms 90000 --timeout-ms 30000
          python scripts/generate_web_dashboard_screenshots.py --verify-repeatability --only theme-system-1920x1080.png --only theme-system-waterfall-1920x1080.png --only theme-pip-boy-inspired-waterfall-800x480.png

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build
          python scripts/generate_web_dashboard_screenshots.py --verify-sdist dist
          python -m twine check dist/*

      - name: Upload distributions
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/sds200/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
