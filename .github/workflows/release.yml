name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"

          PACKAGE_VERSION="$(python -c 'import sds200; print(sds200.__version__)')"

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi

          if [[ "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "sds200.__version__ ${PACKAGE_VERSION} does not match ${VERSION}"
            exit 1
          fi

      - name: Run release checks
        run: |
          ruff check .
          mypy src/sds200
          pytest --cov=sds200 --cov-report=term-missing
          python scripts/check_docs.py

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/sds200/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
