name: CI

on:
  push:
    branches:
      - main
      - codex/mimic-sds-planning
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
      scope: ${{ steps.scope.outputs.scope }}
      changed_count: ${{ steps.scope.outputs.changed_count }}

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/classify_ci_changes.py
          --event "$CI_EVENT_NAME"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Require recognized validation scope
        env:
          FULL_SUITE: ${{ steps.scope.outputs.full_suite }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          case "$FULL_SUITE:$SCOPE" in
            true:full|false:documentation) ;;
            *) echo "Unrecognized CI scope: $FULL_SUITE:$SCOPE" >&2; exit 1 ;;
          esac

  test:
    name: Python ${{ matrix.python-version }}
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Confirm bounded documentation-only scope
        if: needs.classify.outputs.full_suite == 'false'
        run: echo "Full Python validation is not required for this documentation-only change."

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.classify.outputs.full_suite == 'true'

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: needs.classify.outputs.full_suite == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        if: needs.classify.outputs.full_suite == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        if: needs.classify.outputs.full_suite == 'true'
        run: ruff check .

      - name: MyPy
        if: needs.classify.outputs.full_suite == 'true'
        run: mypy src/sds200

      - name: Pytest
        if: needs.classify.outputs.full_suite == 'true'
        run: pytest --cov=sds200 --cov-report=term-missing

  browser-namespace:
    name: Browser namespace / Python ${{ matrix.python-version }}
    needs: classify
    # The latest Ubuntu image denies bwrap UID mapping. Do not disable AppArmor
    # or relax kernel policy. Keep the full suite above on ubuntu-latest; this
    # separate gate uses the still-supported, namespace-capable runner.
    # Migrate before ubuntu-22.04 brownouts start on 2027-03-23, after qualifying a
    # replacement's unprivileged namespace policy (see CONTRIBUTING.md).
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Confirm bounded documentation-only scope
        if: needs.classify.outputs.full_suite == 'false'
        run: echo "Browser namespace validation is not required for this documentation-only change."

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.classify.outputs.full_suite == 'true'

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: needs.classify.outputs.full_suite == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and namespace prerequisite
        if: needs.classify.outputs.full_suite == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Check unprivileged PID isolation
        if: needs.classify.outputs.full_suite == 'true'
        run: |
          python -c 'import os; assert os.geteuid() != 0; os.close(os.pidfd_open(os.getpid()))'
          bwrap --unshare-pid --as-pid-1 --die-with-parent --bind / / --dev-bind /dev /dev --proc /proc -- /bin/true

      - name: Pytest namespace batches
        if: needs.classify.outputs.full_suite == 'true'
        run: >-
          python scripts/run_browser_namespace_tests.py
          --report="${RUNNER_TEMP}/namespace-test-results.xml"

      - name: Require browser namespace tests to execute
        if: needs.classify.outputs.full_suite == 'true'
        run: python scripts/check_browser_namespace_results.py "${RUNNER_TEMP}/namespace-test-results.xml"

      - name: Pytest fixed App native namespace
        if: needs.classify.outputs.full_suite == 'true'
        run: >-
          python -m pytest -q
          tests/test_supplemental_recording_app_native_preflight.py
          tests/test_supplemental_recording_app_fixed_operator.py
          tests/test_supplemental_recording_app_actual_ready.py
          tests/test_supplemental_recording_app_actual_service.py
          tests/test_supplemental_recording_app_actual_recovery.py
          tests/test_supplemental_recording_app_actual_dispatch.py
          --junitxml="${RUNNER_TEMP}/native-recording-namespace-results.xml"

      - name: Require fixed App native namespace tests to execute
        if: needs.classify.outputs.full_suite == 'true'
        run: >-
          python scripts/check_browser_namespace_results.py
          --profile native-recording
          "${RUNNER_TEMP}/native-recording-namespace-results.xml"

  package:
    name: Documentation and package
    needs: classify
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check documentation links
        run: |
          python scripts/check_docs.py
          python scripts/generate_web_dashboard_screenshots.py --verify-gallery

      - name: Real-Chrome dashboard acceptance
        run: node scripts/audit_web_dashboard_browser.mjs --startup-timeout-ms 90000 --timeout-ms 30000

      - name: Real-Chrome Mimic card acceptance
        run: node scripts/audit_home_assistant_mimic.mjs --timeout-ms 30000

      - name: Same-Chrome screenshot repeatability
        id: same_chrome_repeatability
        run: python scripts/generate_web_dashboard_screenshots.py --verify-repeatability --repeatability-evidence-dir "$RUNNER_TEMP/same-chrome-repeatability" --only theme-system-1920x1080.png --only theme-system-waterfall-1920x1080.png --only theme-pip-boy-inspired-waterfall-800x480.png

      - name: Detect Same-Chrome mismatch evidence
        id: same_chrome_evidence
        if: ${{ failure() && steps.same_chrome_repeatability.outcome == 'failure' }}
        run: |
          if test -f "$RUNNER_TEMP/same-chrome-repeatability/report.json"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Same-Chrome mismatch evidence
        if: >-
          ${{
            failure() &&
            steps.same_chrome_repeatability.outcome == 'failure' &&
            steps.same_chrome_evidence.outcome == 'success' &&
            steps.same_chrome_evidence.outputs.available == 'true'
          }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: same-chrome-repeatability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/same-chrome-repeatability/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          python scripts/generate_web_dashboard_screenshots.py --verify-sdist dist
          python -m twine check dist/*
