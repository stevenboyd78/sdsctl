name: "sds200"
version: "0.28.0"
slug: "sds200"
description: "Uniden SDS200 scanner daemon and web dashboard for Home Assistant"
arch:
  - aarch64
  - amd64
url: "https://github.com/stevenboyd78/sdsctl"
image: "ghcr.io/stevenboyd78/sds200-home-assistant"
startup: application
boot: auto
stage: experimental
init: false
services:
  - "mqtt:need"
map:
  - type: media
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
ingress: true
ingress_port: 8099
ingress_stream: true
ports:
  50000/udp: 50000
  50443/tcp: null
  8443/tcp: null
ports_description:
  50000/udp: "SDS200 RTP audio"
  50443/tcp: "Advanced: authenticated daemon clients"
  8443/tcp: "Advanced: native HTTPS dashboard"
panel_title: "sds200"
panel_icon: "mdi:radio-tower"
timeout: 60
options:
  mqtt_topic_prefix: "sdsctl"
  recording_directory: "sdsctl/recordings"
  remote_daemon_enabled: false
  native_dashboard_enabled: false
  advanced_access_server_name: ""
  advanced_access_host_address: ""
schema:
  scanner_host: "str(1,)"
  mqtt_topic_prefix: "str(1,)"
  recording_directory: "str(1,)"
  remote_daemon_enabled: bool
  native_dashboard_enabled: bool
  advanced_access_server_name: "str?"
  advanced_access_host_address: "str?"
